# CI Pipeline — Practical 12 (CI/CD with GitHub Actions)
#
# Runs on every push to `main`, installs dependencies, lints, and runs
# the automated test suite. A red X means a step failed; green means pass.
#
# Jobs:
#   lint          — runs ESLint before tests (supplementary #1)
#   build-and-test — installs deps and runs Jest (core requirement)
name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
