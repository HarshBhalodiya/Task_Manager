# ---- docker-compose.yml (Practical 11) ----
# Orchestrates the three services of the Task Management application:
#   frontend (React, served, port 5173)
#   backend  (Node/Express, port 5000)
#   mongodb  (official mongo image, port 27017)
#
# All three share the internal bridge network "app-network" so they can talk to
# each other by service name. `docker compose up --build` starts the whole stack.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-backend
    ports:
      - "5000:5000"
    environment:
      # Override the local .env MONGO_URI: inside Docker, MongoDB is reached by
      # its Compose service name, NOT localhost.
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - PORT=5000
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: task-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Named volume so task data survives container restart/rebuild.
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
